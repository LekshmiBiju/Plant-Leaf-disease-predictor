<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CNN stem architecture</title>
<desc>Input leaf image passing through Conv2d, ReLU, MaxPool2d, Conv2d, ReLU, AdaptiveAvgPool2d layers with tensor shapes at each stage.</desc>

<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .box { stroke-width: 1; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="300" fill="#ffffff"/>

<!-- Input -->
<g>
  <rect class="box" x="20" y="40" width="86" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text class="th" x="63" y="63" text-anchor="middle" fill="#2C2C2A">Input</text>
  <text class="ts" x="63" y="81" text-anchor="middle" fill="#444441">3,224,224</text>
</g>
<line x1="106" y1="68" x2="130" y2="68" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Conv2d 1 -->
<g>
  <rect class="box" x="130" y="40" width="90" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text class="th" x="175" y="63" text-anchor="middle" fill="#042C53">Conv2d</text>
  <text class="ts" x="175" y="81" text-anchor="middle" fill="#0C447C">64,112,112</text>
</g>
<line x1="220" y1="68" x2="244" y2="68" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ReLU 1 -->
<g>
  <rect class="box" x="244" y="40" width="80" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text class="th" x="284" y="63" text-anchor="middle" fill="#042C53">ReLU</text>
  <text class="ts" x="284" y="81" text-anchor="middle" fill="#0C447C">64,112,112</text>
</g>
<line x1="324" y1="68" x2="348" y2="68" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- MaxPool2d -->
<g>
  <rect class="box" x="348" y="40" width="96" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
  <text class="th" x="396" y="63" text-anchor="middle" fill="#04342C">MaxPool2d</text>
  <text class="ts" x="396" y="81" text-anchor="middle" fill="#085041">64,56,56</text>
</g>
<line x1="444" y1="68" x2="468" y2="68" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Conv2d 2 -->
<g>
  <rect class="box" x="468" y="40" width="90" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text class="th" x="513" y="63" text-anchor="middle" fill="#042C53">Conv2d</text>
  <text class="ts" x="513" y="81" text-anchor="middle" fill="#0C447C">128,56,56</text>
</g>
<line x1="513" y1="96" x2="513" y2="120" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ReLU 2 -->
<g>
  <rect class="box" x="468" y="120" width="90" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text class="th" x="513" y="143" text-anchor="middle" fill="#042C53">ReLU</text>
  <text class="ts" x="513" y="161" text-anchor="middle" fill="#0C447C">128,56,56</text>
</g>
<line x1="468" y1="148" x2="260" y2="148" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- AdaptiveAvgPool2d -->
<g>
  <rect class="box" x="140" y="120" width="120" height="56" rx="8" fill="#FAECE7" stroke="#D85A30"/>
  <text class="th" x="200" y="143" text-anchor="middle" fill="#4A1B0C">AdaptiveAvgPool2d</text>
  <text class="ts" x="200" y="161" text-anchor="middle" fill="#993C1D">128,1,1</text>
</g>

<text class="ts" x="63" y="120" text-anchor="middle" fill="#5F5E5A">channels, H, W</text>

</svg>
